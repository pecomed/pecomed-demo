# =========================================================================
# ProGuard Configuration for PECOMED CAP CDSS (Spring Boot 3 + Java 17)
# =========================================================================

-target 17
-dontwarn
-dontnote
-ignorewarnings
-optimizationpasses 3
-allowaccessmodification
-keepparameternames

# Keep attributes needed for Spring reflection and Jackson serialization
-keepattributes Exceptions,InnerClasses,Signature,Deprecated,SourceFile,LineNumberTable,*Annotation*,EnclosingMethod

# 1. Spring Boot Application entrypoint & Desktop listeners
-keep @org.springframework.boot.autoconfigure.SpringBootApplication class * {
    public *;
}

# 2. Keep Spring Controllers and Configurations
-keep @org.springframework.web.bind.annotation.RestController class * {
    public <methods>;
}
-keep @org.springframework.context.annotation.Configuration class * { *; }
-keep @org.springframework.context.annotation.Bean class * { *; }

# 3. Keep Request/Response DTOs and Jackson annotations
-keepclassmembers class * {
    @com.fasterxml.jackson.annotation.* *;
}
-keep class vn.pecomed.cdss.api.CdssController$* {
    public <fields>;
    public <methods>;
}
-keep class vn.pecomed.cdss.model.** {
    public <fields>;
    public <methods>;
}

# 4. Keep Enums
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
    public <fields>;
    public <methods>;
}

# 5. Keep Engine public APIs for Controller & CLI
-keep class vn.pecomed.cdss.engine.PecomedCdssMaster {
    public <methods>;
}
-keepclassmembers class vn.pecomed.cdss.engine.*Engine {
    public <methods>;
}
-keep class vn.pecomed.cdss.engine.Step4EmpiricalEngine$Step4InputData {
    public <fields>;
    public <methods>;
}

# 6. CLI App entrypoint
-keep class vn.pecomed.cdss.cli.PecomedCliApp {
    public static void main(java.lang.String[]);
}
