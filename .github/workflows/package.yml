name: Build Executable & Fat JAR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (Fat JAR + ProGuard + Windows .exe)
        run: mvn clean package

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pecomed-cdss-windows-exe
          path: target/pecomed-cdss.exe

      - name: Upload Cross-Platform Fat JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pecomed-cdss-fatjar
          path: target/pecomed-cap-cdss-1.0.0.jar
